<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal A Update | Changelog</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --container-bg: #1f2833;
            --text-color: #c5a059;
            --text-muted: #a9a9a9;
            --accent-color: #45f3ff;
            --accent-hover: #1f8a94;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1f2833 0%, #0b0c10 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
            box-shadow: 0 4px 20px rgba(69, 243, 255, 0.1);
            position: relative;
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
        }

        header h1 span {
            color: var(--accent-color);
        }

        header p {
            margin: 10px 0 25px 0;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Menu z linkami */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .nav-btn {
            display: inline-block;
            background: rgba(69, 243, 255, 0.1);
            color: var(--accent-color);
            text-decoration: none;
            padding: 8px 24px;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(69, 243, 255, 0.4);
            transform: translateY(-2px);
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .update-card {
            background-color: var(--container-bg);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-left: 5px solid var(--accent-color);
            transition: transform 0.2s;
        }

        .update-card:hover {
            transform: translateY(-2px);
        }

        .update-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .update-version {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 0;
        }

        .update-date {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 20px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>Steal A <span>Update</span></h1>
        <p>Oficjalna strona z aktualizacjami w grze Steal A Update</p>
        
        <!-- Przyciski nawigacyjne z Twoimi linkami -->
        <div class="nav-links">
            <a href="https://www.roblox.com/games/110455469367771/Steal-A-Update" target="_blank" class="nav-btn">Gra</a>
            <a href="https://discord.gg/qFCCqkKCMj" target="_blank" class="nav-btn">Discord</a>
        </div>
    </header>

    <div class="container">

        <!-- AKTUALIZACJA v1.0.0 -->
        <div class="update-card">
            <div class="update-header">
                <h2 class="update-version">Wersja 1.0.0 (Premiera)</h2>
                <span class="update-date">31 maja 2026</span>
            </div>
            <p>Oficjalna premiera gry! Ukradnij tyle aktualizacji, ile zdołasz unieść.</p>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Steal-A-Update-Changes. Strona stworzona przez <a href="https://github.com/TUTAJ_TWÓJ_NICK_Z_GITHUB" target="_blank">Twój Nick</a></p>
    </footer>

</body>
</html>
